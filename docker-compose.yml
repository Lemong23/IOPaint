version: '3.8'

services:
  mateai-paint:
    build:
      context: .
      dockerfile: Dockerfile.paint
    runtime: nvidia  # GPU 사용 설정
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8060:8060"
    restart: always

  mateai-inpaint:
    build:
      context: .
      dockerfile: Dockerfile.inpaint
    runtime: nvidia  # GPU 사용 설정
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8070:8070"
    restart: always